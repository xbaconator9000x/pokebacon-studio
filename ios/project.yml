name: PokeBaconStudio
options:
  deploymentTarget:
    iOS: '16.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '4.69.7'
    CURRENT_PROJECT_VERSION: '73'
    TARGETED_DEVICE_FAMILY: '1,2'
    PRODUCT_BUNDLE_IDENTIFIER: dev.pokebacon.studio
    CODE_SIGN_STYLE: Automatic
targets:
  PokeBaconStudio:
    type: application
    platform: iOS
    sources:
      - App.swift
      - EditorViewController.swift
      - AssetServer.swift
      - path: Bridge.js
        buildPhase: resources
      - path: Web
        type: folder
      - path: Assets.xcassets
        buildPhase: resources
      - path: LaunchScreen.storyboard
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PokeBaconSmokeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SmokeTests.swift
    dependencies:
      - target: PokeBaconStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pokebacon.studio.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PokeBaconStudio:
    build:
      targets:
        PokeBaconStudio: all
    test:
      targets:
        - PokeBaconSmokeTests
