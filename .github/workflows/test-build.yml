name: Test build
# Manual only. Builds and signs an APK from the selected branch with the
# original release key and uploads it as a workflow artifact. It never creates
# a release, tag or Pages deploy.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PINNED_CERT_SHA256: 1181de51b390457daaf04ea9c63108dc084da9597bef23bf2bc19090e1ae7add
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android build tools
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned APK
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" python3 android/build.py --unsigned
      - name: Sign and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.POKEBACON_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POKEBACON_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" || { echo "Signing secrets are not set."; exit 1; }
          KS="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          UNSIGNED="$(ls android/build/PokeBacon_Studio_v*_unsigned.apk)"
          mkdir -p out
          OUT="out/PokeBacon_Studio_test_${GITHUB_SHA::7}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-key-alias pokebacon \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$OUT" "$UNSIGNED"
          rm -f "$KS"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "certificate SHA-256 digest: $PINNED_CERT_SHA256" "$RUNNER_TEMP/verify.txt" || { echo "Signing certificate does not match the pinned original."; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: out/*.apk
          retention-days: 7
