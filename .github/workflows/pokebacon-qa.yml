name: PokéBacon QA
on:
  push:
    branches: [main, 'reconcile/**']
  pull_request:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pokebacon-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/qa-source-gate.mjs
      - run: node scripts/check-feature-audit.mjs
      - run: python3 scripts/test-capture-android.py
  android-source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install official Android SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile native shell and package all reconciled assets
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" python3 android/build.py --unsigned
      - name: Prepare unsigned APK for local release signing
        run: |
          mkdir -p "$RUNNER_TEMP/pokebacon-signable"
          cp android/build/PokeBacon_Studio_v*_unsigned.apk "$RUNNER_TEMP/pokebacon-signable/"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/pokebacon-signable/apksigner.jar"
          test "$(find "$RUNNER_TEMP/pokebacon-signable" -name '*_unsigned.apk' | wc -l)" -eq 1
      - name: Export unsigned, exact-head build (no private keys)
        uses: actions/upload-artifact@v4
        with:
          name: pokebacon-unsigned-release-candidate
          path: ${{ runner.temp }}/pokebacon-signable/
          if-no-files-found: error
          retention-days: 3
  portable-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund jsdom@26 fake-indexeddb esbuild @napi-rs/canvas playwright@1.51.1
      - name: Test actual mobile browser workflows
        env:
          MAP_STUDIO_QA_RUNTIME: ${{ runner.temp }}/qa/node_modules
          MAP_STUDIO_SCREENSHOTS: ${{ runner.temp }}/pokebacon-mobile-screens
        run: MAP_STUDIO_CHROMIUM="$(command -v google-chrome || command -v chromium)" node scripts/test-release-mobile-browser.mjs
      - name: Keep mobile acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-workflow-screenshots
          path: ${{ runner.temp }}/pokebacon-mobile-screens
          if-no-files-found: ignore
      - name: Run music UI and full editor checks
        env:
          MAP_STUDIO_QA_RUNTIME: ${{ runner.temp }}/qa/node_modules
          MAP_STUDIO_BUILD_RUNTIME: ${{ runner.temp }}/qa/node_modules
        run: |
          node scripts/test-project-storage.mjs
          node scripts/test-music-midi-parts-ui.mjs
          node scripts/test-music-track-style-ui.mjs
          node scripts/test-music-quick-ui.mjs
