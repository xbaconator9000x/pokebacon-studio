name: Android phone previews
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build preview APK
        env:
          MAP_STUDIO_KEYSTORE: ${{ runner.temp }}/preview.p12
          MAP_STUDIO_KEY_ALIAS: preview
          MAP_STUDIO_KEY_PASSWORD: android
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          keytool -genkeypair -keystore "$MAP_STUDIO_KEYSTORE" -storetype PKCS12 -alias preview -keyalg RSA -keysize 2048 -validity 2 -storepass android -keypass android -dname 'CN=Simulator Preview'
          python3 android/build.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/capture-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PokeBacon-Android-screenshots
          path: android/previews
          if-no-files-found: ignore
