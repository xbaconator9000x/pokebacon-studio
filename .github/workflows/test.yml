name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Install isolated music UI test runtime
        run: npm install --prefix "$RUNNER_TEMP/music-ui" --no-audit --no-fund jsdom@26
      - name: Test source-song and multipart MIDI controls
        env:
          MAP_STUDIO_QA_RUNTIME: ${{ runner.temp }}/music-ui/node_modules
        run: |
          node scripts/test-music-track-style-ui.mjs
          node scripts/test-music-midi-parts-ui.mjs
