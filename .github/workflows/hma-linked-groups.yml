name: HMA linked native table acceptance
on:
  pull_request:
    paths:
      - 'dist/hma-*.js'
      - 'dist/native-hex-workspace.js'
      - 'tests/hma-*.test.js'
      - '.github/workflows/hma-linked-groups.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hma-linked-review-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-hma-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - hma-linked-expansion
          - hma-table-formats
          - hma-table-expansion
          - hma-table-transaction-counts
          - hma-engine-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test ${{ matrix.suite }} source/natives
        run: node --test tests/${{ matrix.suite }}.test.js
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original Android identity and deployed SHA256 assets
        run: node scripts/qa-source-gate.mjs
